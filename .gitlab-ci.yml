# Spike for Redmine #27127: probes whether an explicit image can be pulled. Spike branch only.
spike-image:
  image: python:3.12-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/27127-ci-spike"'
  script:
    - |
      python3 --version
      apk add --no-cache git curl >/dev/null 2>&1 && echo "apk ok" || echo "apk FAILED"
      git --version
      curl --version | head -1
      echo "depth=$GIT_DEPTH"
      git log --oneline -3
      git log --format='%H %P' -1
